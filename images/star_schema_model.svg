<svg width="860" height="560" viewBox="0 0 860 560" xmlns="http://www.w3.org/2000/svg">
  <rect width="860" height="560" rx="16" fill="#0B1329" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Header -->
  <rect width="860" height="46" rx="16" fill="#1E293B"/>
  <rect y="30" width="860" height="16" fill="#1E293B"/>
  <circle cx="26" cy="23" r="6" fill="#EF4444"/>
  <circle cx="46" cy="23" r="6" fill="#F59E0B"/>
  <circle cx="66" cy="23" r="6" fill="#10B981"/>
  <text x="430" y="28" fill="#F8FAFC" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold">Modern Data Warehouse / Ralph Kimball Star Schema Data Model</text>

  <!-- Central Fact Table -->
  <g font-family="sans-serif" font-size="12">
    <!-- fact_sales_order_detail -->
    <rect x="290" y="200" width="280" height="180" rx="8" fill="#1E293B" stroke="#F43F5E" stroke-width="2"/>
    <rect x="290" y="200" width="280" height="30" rx="8" fill="#F43F5E"/>
    <text x="430" y="220" fill="#FFFFFF" font-weight="bold" text-anchor="middle">fact_sales_order_detail (FACT)</text>
    <text x="305" y="250" fill="#F43F5E" font-weight="bold">PK  detail_key</text>
    <text x="305" y="270" fill="#38BDF8">FK  customer_key, product_key</text>
    <text x="305" y="290" fill="#38BDF8">FK  store_key, location_key, currency_key</text>
    <text x="305" y="310" fill="#38BDF8">FK  order_date_key</text>
    <text x="305" y="330" fill="#F8FAFC">    item_quantity, price_original, exchange_rate</text>
    <text x="305" y="350" fill="#10B981" font-weight="bold">    price_usd, subtotal_usd</text>

    <!-- Top: dim_date -->
    <rect x="340" y="65" width="180" height="100" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="340" y="65" width="180" height="26" rx="8" fill="#0284C7"/>
    <text x="430" y="82" fill="#FFFFFF" font-weight="bold" text-anchor="middle">dim_date</text>
    <text x="350" y="105" fill="#38BDF8" font-weight="bold">PK  date_key (YYYYMMDD)</text>
    <text x="350" y="125" fill="#94A3B8">    year, quarter, month</text>
    <text x="350" y="145" fill="#94A3B8">    week_of_year, is_weekend</text>

    <!-- Left Top: dim_customer (SCD2) -->
    <rect x="30" y="110" width="220" height="140" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1.5"/>
    <rect x="30" y="110" width="220" height="26" rx="8" fill="#7E22CE"/>
    <text x="140" y="128" fill="#FFFFFF" font-weight="bold" text-anchor="middle">dim_customer (SCD Type 2)</text>
    <text x="40" y="150" fill="#A855F7" font-weight="bold">PK  customer_key (-1 Unknown)</text>
    <text x="40" y="170" fill="#94A3B8">    customer_device_id</text>
    <text x="40" y="190" fill="#EF4444">    customer_email [PII Tag]</text>
    <text x="40" y="210" fill="#10B981">    version, start_time, end_time</text>
    <text x="40" y="230" fill="#10B981">    is_current (BOOL)</text>

    <!-- Right Top: dim_product -->
    <rect x="610" y="110" width="220" height="130" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="610" y="110" width="220" height="26" rx="8" fill="#0284C7"/>
    <text x="720" y="128" fill="#FFFFFF" font-weight="bold" text-anchor="middle">dim_product</text>
    <text x="620" y="150" fill="#38BDF8" font-weight="bold">PK  product_key</text>
    <text x="620" y="170" fill="#94A3B8">    sku, product_name</text>
    <text x="620" y="190" fill="#94A3B8">    category_name, collection</text>
    <text x="620" y="210" fill="#94A3B8">    min_price, max_price</text>

    <!-- Bottom Left: dim_store -->
    <rect x="40" y="410" width="180" height="90" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="40" y="410" width="180" height="26" rx="8" fill="#0284C7"/>
    <text x="130" y="428" fill="#FFFFFF" font-weight="bold" text-anchor="middle">dim_store</text>
    <text x="50" y="450" fill="#38BDF8" font-weight="bold">PK  store_key</text>
    <text x="50" y="470" fill="#94A3B8">    store_code, store_domain</text>

    <!-- Bottom Center: dim_location -->
    <rect x="260" y="410" width="210" height="110" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="260" y="410" width="210" height="26" rx="8" fill="#0284C7"/>
    <text x="365" y="428" fill="#FFFFFF" font-weight="bold" text-anchor="middle">dim_location</text>
    <text x="270" y="450" fill="#38BDF8" font-weight="bold">PK  location_key</text>
    <text x="270" y="470" fill="#94A3B8">    ip, city_name, region_name</text>
    <text x="270" y="490" fill="#94A3B8">    country_code, latitude, longitude</text>

    <!-- Bottom Right: dim_currency & fact_exchange_rate -->
    <rect x="510" y="410" width="160" height="90" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="510" y="410" width="160" height="26" rx="8" fill="#0284C7"/>
    <text x="590" y="428" fill="#FFFFFF" font-weight="bold" text-anchor="middle">dim_currency</text>
    <text x="520" y="450" fill="#38BDF8" font-weight="bold">PK  currency_key</text>
    <text x="520" y="470" fill="#94A3B8">    currency_code, name</text>

    <rect x="690" y="410" width="150" height="90" rx="8" fill="#1E293B" stroke="#F43F5E" stroke-width="1.5"/>
    <rect x="690" y="410" width="150" height="26" rx="8" fill="#F43F5E"/>
    <text x="765" y="428" fill="#FFFFFF" font-weight="bold" text-anchor="middle">fact_exchange_rate</text>
    <text x="700" y="450" fill="#38BDF8">FK  date_key, curr_key</text>
    <text x="700" y="470" fill="#10B981">    exchange_rate (USD)</text>

    <!-- Connector Lines -->
    <line x1="430" y1="165" x2="430" y2="200" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4"/>
    <line x1="250" y1="200" x2="290" y2="250" stroke="#A855F7" stroke-width="2"/>
    <line x1="610" y1="200" x2="570" y2="250" stroke="#38BDF8" stroke-width="2"/>
    <line x1="180" y1="410" x2="320" y2="380" stroke="#38BDF8" stroke-width="2"/>
    <line x1="365" y1="410" x2="430" y2="380" stroke="#38BDF8" stroke-width="2"/>
    <line x1="590" y1="410" x2="520" y2="380" stroke="#38BDF8" stroke-width="2"/>
  </g>
  <text x="430" y="540" fill="#64748B" font-family="sans-serif" font-size="12" text-anchor="middle">Surrogate keys default to -1 for Unknown / Late-Arriving records</text>
</svg>