<svg width="960" height="225" viewBox="0 0 960 225" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="mongoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="locGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="prodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#A855F7"/>
    </marker>
  </defs>

  <!-- Window Frame -->
  <rect width="960" height="225" rx="16" fill="#0B1120" stroke="#334155" stroke-width="1.5"/>
  <rect width="960" height="42" rx="16" fill="#1E293B"/>
  <rect y="26" width="960" height="16" fill="#1E293B"/>
  <circle cx="26" cy="21" r="6" fill="#EF4444"/>
  <circle cx="46" cy="21" r="6" fill="#F59E0B"/>
  <circle cx="66" cy="21" r="6" fill="#10B981"/>
  <text x="480" y="26" fill="#94A3B8" font-family="monospace" font-size="13" text-anchor="middle" font-weight="bold">Cloud Functions (Serverless) / Eventarc Trigger &amp; BigQuery Ingestion</text>

  <!-- Workflow Diagram -->
  <g font-family="system-ui, -apple-system, sans-serif">
    
    <!-- 3 Source Folders on the Left -->
    <!-- Folder 1: mongo_data_string -->
    <rect x="25" y="66" width="185" height="38" rx="8" fill="url(#mongoGrad)" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="38" y="90" font-size="14">📁</text>
    <text x="62" y="90" fill="#FBBF24" font-family="monospace" font-size="12" font-weight="bold">mongo_data_string</text>

    <!-- Folder 2: location_data -->
    <rect x="25" y="114" width="185" height="38" rx="8" fill="url(#locGrad)" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="38" y="138" font-size="14">📁</text>
    <text x="62" y="138" fill="#22D3EE" font-family="monospace" font-size="12" font-weight="bold">location_data</text>

    <!-- Folder 3: product_data -->
    <rect x="25" y="162" width="185" height="38" rx="8" fill="url(#prodGrad)" stroke="#EC4899" stroke-width="1.5"/>
    <text x="38" y="186" font-size="14">📁</text>
    <text x="62" y="186" fill="#F472B6" font-family="monospace" font-size="12" font-weight="bold">product_data</text>

    <!-- Convergence lines from 3 folders to GCS Event -->
    <path d="M 210 85 C 235 85, 235 133, 260 133" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3,3" fill="none" opacity="0.85"/>
    <path d="M 210 133 L 260 133" stroke="#06B6D4" stroke-width="2" fill="none" opacity="0.85"/>
    <path d="M 210 181 C 235 181, 235 133, 260 133" stroke="#EC4899" stroke-width="2" stroke-dasharray="3,3" fill="none" opacity="0.85"/>

    <!-- Step 1: GCS Event -->
    <rect x="260" y="72" width="180" height="122" rx="10" fill="url(#boxGrad)" stroke="#38BDF8" stroke-width="2"/>
    <text x="350" y="105" fill="#38BDF8" font-size="15" font-weight="bold" text-anchor="middle">GCS Event</text>
    <text x="350" y="128" fill="#E2E8F0" font-size="12" text-anchor="middle">object.v1.finalized</text>
    <rect x="278" y="142" width="144" height="24" rx="4" fill="#0F172A" stroke="#1E293B"/>
    <text x="350" y="158" fill="#38BDF8" font-family="monospace" font-size="10.5" text-anchor="middle">gs://raw_glamira/*</text>

    <!-- Arrow 1: GCS -> Cloud Function -->
    <path d="M 440 133 L 490 133" stroke="#38BDF8" stroke-width="2.5" fill="none" marker-end="url(#arrowBlue)"/>

    <!-- Step 2: Cloud Function -->
    <rect x="500" y="72" width="205" height="122" rx="10" fill="url(#boxGrad)" stroke="#A855F7" stroke-width="2"/>
    <text x="602" y="105" fill="#A855F7" font-size="15" font-weight="bold" text-anchor="middle">Cloud Function</text>
    <text x="602" y="128" fill="#E2E8F0" font-size="12" text-anchor="middle">trigger_bigquery_load</text>
    <rect x="522" y="142" width="160" height="24" rx="4" fill="#0F172A" stroke="#1E293B"/>
    <text x="602" y="158" fill="#C084FC" font-family="monospace" font-size="10.5" text-anchor="middle">Gen 2 / Eventarc</text>

    <!-- Arrow 2: Cloud Function -> BigQuery -->
    <path d="M 705 133 L 755 133" stroke="#A855F7" stroke-width="2.5" fill="none" marker-end="url(#arrowPurple)"/>

    <!-- Step 3: BigQuery Landing -->
    <rect x="765" y="72" width="170" height="122" rx="10" fill="url(#boxGrad)" stroke="#10B981" stroke-width="2"/>
    <text x="850" y="105" fill="#10B981" font-size="15" font-weight="bold" text-anchor="middle">BigQuery Landing</text>
    <text x="850" y="128" fill="#E2E8F0" font-size="12" text-anchor="middle">dataset: landing</text>
    <rect x="780" y="142" width="140" height="24" rx="4" fill="#0F172A" stroke="#1E293B"/>
    <text x="850" y="158" fill="#34D399" font-family="monospace" font-size="10" text-anchor="middle">raw_* tables</text>
  </g>
</svg>