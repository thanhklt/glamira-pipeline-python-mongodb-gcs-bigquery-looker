  <g font-family="monospace" font-size="12">
    <text x="50" y="488" fill="#38BDF8">Diamond Engagement Ring 14k White Gold</text>
    <text x="450" y="488" fill="#94A3B8">Category: Rings</text>
    <text x="620" y="488" fill="#94A3B8">Units: 842</text>
    <text x="750" y="488" fill="#10B981" font-weight="bold">$412,580</text>

    <text x="50" y="515" fill="#38BDF8">Sapphire Tennis Bracelet Rose Gold</text>
    <text x="450" y="515" fill="#94A3B8">Category: Bracelets</text>
    <text x="620" y="515" fill="#94A3B8">Units: 512</text>
