    <rect x="125" y="290" width="35" height="90" rx="4"/>
    <rect x="185" y="270" width="35" height="110" rx="4"/>
    <rect x="245" y="250" width="35" height="130" rx="4"/>
    <rect x="305" y="280" width="35" height="100" rx="4"/>
    <rect x="365" y="240" width="35" height="140" rx="4"/>
