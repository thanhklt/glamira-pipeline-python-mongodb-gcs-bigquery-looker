version: 2

sources:
  - name: landing
    database: glamira-project-502214
    schema: landing
    tables:
      - name: raw_mongo
      - name: raw_location
      - name: raw_product

seeds:
  - name: currency_mapping
    description: Gemini-generated mapping from raw checkout currency values to ISO 4217.
    columns:
      - name: raw_currency
        tests: [not_null]
      - name: domain_suffix
        tests: [not_null]
      - name: currency_code
        tests: [not_null]
      - name: currency_name
        tests: [not_null]

models:
  - name: stg_currency
    description: Currency dimension derived from checkout_success cart products.
    columns:
      - name: currency_key
        description: Stable BigQuery fingerprint of the ISO currency code.
        tests: [not_null, unique]
      - name: currency_code
        description: ISO 4217 three-letter currency code.
        tests: [not_null, unique]
      - name: currency_name
        description: Official English currency name generated with Gemini and persisted in the mapping.
        tests: [not_null]
